# The main pipeline for retail_anlystics_prod

resources:
  pipelines:
    retail_anlystics_prod_etl:
      name: retail_anlystics_prod_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/retail_anlystics_prod_etl"

      libraries:
        - glob:
            include: ../src/retail_anlystics_prod_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
